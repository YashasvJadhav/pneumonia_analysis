version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: pneumonia_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@123
      POSTGRES_DB: pneumonia_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pneumonia_backend_server
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:Postgres%40123@db:5432/pneumonia_analysis
      SECRET_KEY: pneumonia_secret_key
      MODEL_PATH: ml_models/pneumonia_densenet121.keras
      JWT_EXPIRATION_DAYS: 7
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./Backend/uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: pneumonia_frontend_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
